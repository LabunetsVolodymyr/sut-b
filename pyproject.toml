[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "courses-variant12"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.118,<1", "uvicorn>=0.34,<1", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "requests>=2.31,<3", "testcontainers>=4.8,<5"]
regression = ["pytest>=8,<9", "testcontainers[postgres]>=4.8,<5"]

[tool.setuptools.packages.find]
include = ["courses*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast tests without DB, Docker or network",
    "smoke: fast critical-path subset of the regression suite",
    "regression: full regression suite (includes smoke)",
]